<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A daily digest of AI & technology news, updated every morning." />
  <title>Morning — AI &amp; Tech News Digest</title>
  <link rel="preconnect" href="https://noixtuoxwfvkvsqylffo.supabase.co" crossorigin />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🌅</span>
        <div>
          <h1>Morning</h1>
          <p class="tagline">Your daily AI &amp; tech news digest</p>
        </div>
      </div>
      <button id="refresh" class="btn" type="button" title="Reload the latest items">
        <span class="btn-icon" aria-hidden="true">↻</span>
        <span>Refresh</span>
      </button>
    </div>
  </header>

  <nav class="tabs wrap" role="tablist" aria-label="Views">
    <button class="tab is-active" role="tab" aria-selected="true" data-view="news">News digest</button>
    <button class="tab" role="tab" aria-selected="false" data-view="models">Model releases</button>
  </nav>

  <main class="wrap" id="main">
    <div class="toolbar">
      <label class="search" for="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Filter by keyword, source…" autocomplete="off" />
      </label>
      <span id="count" class="count" aria-live="polite"></span>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="feed" class="feed" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Data from Supabase · Digest generated daily · <a id="source-link" href="#" rel="noopener">view raw table info</a></p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
