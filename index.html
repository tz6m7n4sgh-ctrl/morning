<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A daily digest of AI & technology news, updated every morning." />
  <title>Morning — AI &amp; Tech News Digest</title>
  <meta name="theme-color" content="#ff7a3c" />
  <link rel="preconnect" href="https://noixtuoxwfvkvsqylffo.supabase.co" crossorigin />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🌅</span>
        <div>
          <h1>Morning</h1>
          <p class="tagline" id="tagline">Your daily AI &amp; tech news digest</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="lang-toggle" class="btn" type="button" title="التبديل إلى العربية">العربية</button>
        <button id="refresh" class="btn" type="button" title="Reload the latest items">
          <span class="btn-icon" aria-hidden="true">↻</span>
          <span id="refresh-label">Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="tabs wrap" role="tablist" aria-label="Views">
    <button class="tab is-active" role="tab" aria-selected="true" data-view="news">News digest</button>
    <button class="tab" role="tab" aria-selected="false" data-view="models">Model releases</button>
  </nav>

  <main class="wrap" id="main">
    <div class="toolbar">
      <label class="search" for="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Filter by keyword, source…" autocomplete="off" />
      </label>
      <span id="count" class="count" aria-live="polite"></span>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="feed" class="feed" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-text">Data from Supabase · Digest generated daily · <a id="source-link" href="#" rel="noopener">view raw table info</a></p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
